<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>승인 대기</title>
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body class="page-auth">
  <main class="panel auth-panel">
    <p class="eyebrow">Account Status</p>
    <h1 class="panel-title">승인 대기 중입니다</h1>
    {% if user %}
      <p class="panel-subtitle">계정: <strong>{{ user.email }}</strong></p>
    {% endif %}
    <p class="panel-subtitle">담당 관리자의 승인 후 서비스 이용이 가능합니다.<br>잠시만 기다려 주시기 바랍니다.</p>
    <a href="/logout" class="primary-btn link-btn">로그아웃</a>
  </main>
</body>
</html>
